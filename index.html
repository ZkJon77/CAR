<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Car Manager — Sistema de gerenciamento de carros com CRUD completo." />
  <title>🚗 Car Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Toast de notificação -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <div class="header__brand">
        <span class="header__icon">🚗</span>
        <h1 class="header__title">Car Manager</h1>
      </div>
      <p class="header__tagline">Gerencie sua frota com estilo</p>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Seção do formulário -->
    <section class="form-section" id="form-section">
      <div class="form-header">
        <h2 id="form-title">Novo Carro</h2>
        <button type="button" class="btn btn--ghost" id="btn-cancel" style="display:none;" aria-label="Cancelar edição">
          ✕ Cancelar
        </button>
      </div>

      <form id="car-form" class="car-form" novalidate>
        <input type="hidden" id="car-id" />

        <div class="form-grid">
          <div class="form-group">
            <label for="marca" class="form-label">Marca</label>
            <input type="text" id="marca" name="marca" class="form-input" placeholder="Ex: Toyota" required />
          </div>

          <div class="form-group">
            <label for="modelo" class="form-label">Modelo</label>
            <input type="text" id="modelo" name="modelo" class="form-input" placeholder="Ex: Corolla" required />
          </div>

          <div class="form-group">
            <label for="preco" class="form-label">Preço (R$)</label>
            <input type="number" id="preco" name="preco" class="form-input" placeholder="Ex: 120000" min="0" step="0.01" required />
          </div>

          <div class="form-group">
            <label for="foto" class="form-label">URL da Foto</label>
            <input type="url" id="foto" name="foto" class="form-input" placeholder="https://exemplo.com/foto.jpg" />
          </div>
        </div>

        <button type="submit" class="btn btn--primary" id="btn-submit">
          <span class="btn__text">Cadastrar Carro</span>
          <span class="btn__loader" style="display:none;"></span>
        </button>
      </form>
    </section>

    <!-- Seção de listagem -->
    <section class="list-section">
      <div class="list-header">
        <h2>Frota Cadastrada</h2>
        <span class="badge" id="car-count">0</span>
      </div>

      <!-- Loading -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Carregando carros...</p>
      </div>

      <!-- Estado vazio -->
      <div id="empty-state" class="empty-state" style="display:none;">
        <span class="empty-state__icon">🏁</span>
        <p class="empty-state__text">Nenhum carro cadastrado ainda.</p>
        <p class="empty-state__sub">Use o formulário acima para adicionar o primeiro!</p>
      </div>

      <!-- Grid de cards -->
      <div id="cars-grid" class="cars-grid"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Car Manager &copy; 2026 — Feito com ❤️ e Node.js + MongoDB</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
